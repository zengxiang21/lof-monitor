name: 数据源探测

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测深交所主域份额接口
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          probe() {
            local name="$1" url="$2" referer="$3"
            local code size snippet
            if [ -n "$referer" ]; then
              code=$(curl -sL -o /tmp/body -w "%{http_code}" --max-time 25 \
                -H "User-Agent: $UA" -H "Referer: $referer" "$url" || echo "CURL_ERR")
            else
              code=$(curl -sL -o /tmp/body -w "%{http_code}" --max-time 25 \
                -H "User-Agent: $UA" "$url" || echo "CURL_ERR")
            fi
            size=$(wc -c < /tmp/body 2>/dev/null || echo 0)
            snippet=$(head -c 250 /tmp/body 2>/dev/null | tr '\n' ' ' | tr -d '\r')
            echo "== $name => HTTP $code, ${size}B"
            echo "   body: $snippet"
            return 0
          }
          probe "深交所主域-基金列表(含份额)" "https://www.szse.cn/api/report/ShowReport/data?SHOWTYPE=JSON&CATALOGID=1105&TABKEY=tab1&tab1PAGENO=1" "https://www.szse.cn/market/fund/list/index.html"
          probe "深交所子域-xlsx(旧源)" "https://fund.szse.cn/api/report/ShowReport?SHOWTYPE=xlsx&CATALOGID=1000_lf&TABKEY=tab1" "https://fund.szse.cn/marketdata/fundslist/index.html"
          probe "东财行情clist" "https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=3&po=1&np=1&fltt=2&invt=2&fid=f3&fs=b:MK0021,b:MK0022,b:MK0023,b:MK0024&fields=f12,f14,f2,f3,f5,f6" "https://quote.eastmoney.com/"
          probe "东财行情clist-pz1000(采集同参)" "https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=1000&po=1&np=1&fltt=2&invt=2&fid=f3&fs=b:MK0021,b:MK0022,b:MK0023,b:MK0024&fields=f12,f14,f2,f3,f5,f6" "https://quote.eastmoney.com/"
          probe "东财估值GetFundGZList" "https://api.fund.eastmoney.com/FundGuZhi/GetFundGZList?type=8&sort=3&orderType=desc&canbuy=0&pageIndex=1&pageSize=3&_=1" "https://fund.eastmoney.com/"
          echo "ALL_PROBES_DONE"
      - name: httpx 精确复现采集请求
        run: |
          pip install -q httpx
          python - <<'EOF'
          import httpx
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          for pz in (3, 100, 1000):
              url = "https://push2.eastmoney.com/api/qt/clist/get"
              params = {"pn": 1, "pz": pz, "po": 1, "np": 1, "fltt": 2, "invt": 2,
                        "fid": "f3", "fs": "b:MK0021,b:MK0022,b:MK0023,b:MK0024",
                        "fields": "f12,f14,f2,f3,f5,f6"}
              try:
                  with httpx.Client(timeout=15, headers={"User-Agent": UA,
                                                         "Referer": "https://quote.eastmoney.com/"}) as cli:
                      r = cli.get(url, params=params)
                  body = r.text
                  try:
                      n = len(((r.json().get("data") or {}).get("diff")) or [])
                  except Exception as e:
                      n = f"JSON_ERR:{e}"
                  print(f"pz={pz}: HTTP {r.status_code}, {len(body)}B, diff={n}, head={body[:120]!r}")
              except Exception as e:
                  print(f"pz={pz}: EXC {type(e).__name__}: {e}")
          EOF
      - name: curl_cffi vs curl 子进程 全端点对比
        run: |
          pip install -q curl_cffi
          python - <<'EOF'
          import json, subprocess
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          targets = [
            ("push2-clist-pz100", "https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=100&po=1&np=1&fltt=2&invt=2&fid=f3&fs=b:MK0021,b:MK0022,b:MK0023,b:MK0024&fields=f12,f14,f2,f3,f5,f6", "https://quote.eastmoney.com/"),
            ("push2-clist-pz1000", "https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=1000&po=1&np=1&fltt=2&invt=2&fid=f3&fs=b:MK0021,b:MK0022,b:MK0023,b:MK0024&fields=f12,f14,f2,f3,f5,f6", "https://quote.eastmoney.com/"),
            ("FundGuZhi估值", "https://api.fund.eastmoney.com/FundGuZhi/GetFundGZList?type=8&sort=3&orderType=desc&canbuy=0&pageIndex=1&pageSize=3&_=1", "https://fund.eastmoney.com/"),
            ("fundf10净值", "https://fundf10.eastmoney.com/F10DataApi.aspx?type=lsjz&code=160105&pageIndex=1&pageSize=3", "https://fundf10.eastmoney.com/"),
            ("szse份额JSON", "https://fund.szse.cn/api/report/ShowReport/data?SHOWTYPE=JSON&CATALOGID=1000_lf&TABKEY=tab1&selectJjlb=LOF&PAGENO=1", "https://fund.szse.cn/marketdata/fundslist/index.html"),
            ("sse份额", "https://query.sse.com.cn/commonQuery.do?jsonCallBack=cb&isPagination=true&sqlId=COMMON_SSE_SJ_JJSJ_JJGM_LOFGMTJ_L&PRODUCT_TYPE=11,14,15&SEARCH_DATE=&type=inParams&pageHelp.pageSize=500&pageHelp.pageNo=1&pageHelp.beginPage=1&pageHelp.cacheSize=1", "https://www.sse.com.cn/market/funddata/volumn/lofvolumn/"),
            ("腾讯行情", "https://qt.gtimg.cn/q=sh160105,sz160106", ""),
          ]
          from curl_cffi import requests as creq
          for name, url, ref in targets:
              hdr = {"User-Agent": UA}
              if ref:
                  hdr["Referer"] = ref
              # curl_cffi Chrome 伪装
              try:
                  r = creq.get(url, headers=hdr, impersonate="chrome", timeout=20)
                  print(f"[cffi ] {name}: HTTP {r.status_code}, {len(r.text)}B, head={r.text[:80]!r}")
              except Exception as e:
                  print(f"[cffi ] {name}: EXC {type(e).__name__}: {str(e)[:100]}")
              # curl 子进程
              try:
                  cmd = ["curl", "-sL", "--max-time", "20", "-H", f"User-Agent: {UA}"]
                  if ref:
                      cmd += ["-H", f"Referer: {ref}"]
                  cmd.append(url)
                  out = subprocess.run(cmd, capture_output=True, text=True, timeout=30).stdout
                  print(f"[curl ] {name}: {len(out)}B, head={out[:80]!r}")
              except Exception as e:
                  print(f"[curl ] {name}: EXC {type(e).__name__}: {str(e)[:100]}")
          EOF
